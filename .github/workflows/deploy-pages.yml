name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run check:stations
      - name: Build static site and generate SEO pages
        run: npm run build

      - name: Verify generated SEO pages
        run: |
          test -f dist/index.html
          test -f dist/guide/index.html
          test -f dist/about/index.html
          test -f dist/stations/index.html
          test -f dist/news/index.html
          test -f dist/en/stations/index.html
          test -f dist/en/guide/index.html
          test -f dist/en/about/index.html
          test -f dist/ja/stations/index.html
          test -f dist/ja/guide/index.html
          test -f dist/ja/about/index.html
          test -f dist/stations/1000/index.html
          test -f dist/sitemap.xml
          grep -q '<h1>台鐵時刻表查詢</h1>' dist/index.html
          grep -q '<h1>台鐵時刻表查詢說明</h1>' dist/guide/index.html
          grep -q '<h1>臺北車站時刻表</h1>' dist/stations/1000/index.html
          test "$(grep -o '<url>' dist/sitemap.xml | wc -l | tr -d ' ')" = 1
          test "$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | tr -d '\n')" = '<loc>https://tra-timetable.cftang.dev/</loc>'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
