name: Daily download TRA data

on:
  schedule:
    # GitHub cron is UTC. 03:00 Asia/Taipei = 19:00 UTC (previous day)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-download
  cancel-in-progress: true

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # ✅ 防止 days 目錄越長越大：每次重新生成一個乾淨的 window
      - name: Clean old data window
        run: |
          rm -rf public/data/days
          mkdir -p public/data/days

      - name: Run download
        run: npm run download

      - name: Commit changes (if any)
        run: |
          set -e

          # ✅ 用 status 才抓得到 untracked / deletions / modifications
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ✅ -A 會 stage deletions + new files
          git add -A public/data/days public/data/meta
          git commit -m "chore(data): daily update"
          git push
