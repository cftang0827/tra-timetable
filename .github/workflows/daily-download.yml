name: Daily download TRA data + Deploy Pages

on:
  schedule:
    # GitHub cron is UTC. 03:00 Asia/Taipei = 19:00 UTC (previous day)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-download
  cancel-in-progress: true

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    outputs:
      did_push: ${{ steps.commit.outputs.did_push }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # ✅ 防止 days 目錄越長越大：每次重新生成一個乾淨的 window
      - name: Clean old data window
        run: |
          rm -rf public/data/days
          mkdir -p public/data/days

      - name: Run download
        run: npm run download

      - name: Check station metadata
        run: npm run check:stations

      - name: Commit changes (if any) + push
        id: commit
        run: |
          set -e

          # ✅ 用 status 才抓得到 untracked / deletions / modifications
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "did_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ✅ -A 會 stage deletions + new files
          git add -A public/data/days public/data/meta
          git commit -m "chore(data): daily update"
          git push

          echo "did_push=true" >> "$GITHUB_OUTPUT"

  build:
    needs: download-and-commit
    if: ${{ needs.download-and-commit.outputs.did_push == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run check:stations
      - name: Build static site and generate SEO pages
        run: npm run build

      - name: Verify generated SEO pages
        run: |
          test -f dist/stations/1000/index.html
          test -f dist/sitemap.xml
          grep -q 'https://tra-timetable.cftang.dev/stations/1000/' dist/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
