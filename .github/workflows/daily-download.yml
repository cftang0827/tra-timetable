name: Daily download TRA data

on:
  schedule:
    # GitHub Actions schedule uses UTC.
    # 02:10 Asia/Taipei = 18:10 UTC (previous day)
    - cron: "10 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-download
  cancel-in-progress: true

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run download
        run: npm run download

      - name: Commit changes (if any)
        run: |
          set -e

          # If nothing changed, exit cleanly
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(data): daily update"
          git push
