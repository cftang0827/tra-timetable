services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm

volumes:
  node_modules:
  npm_cache:
